# .github/workflows/ci.yml
# ==========================================
# Nothing in this repo enforced anything before: `tsc` errors and failing tests
# reached `production` silently. This runs exactly the commands an agent runs
# by hand (see AGENT.md §13) on every push and PR.
#
# The *unit* job is DB-free on purpose — those tests use fakes, so a developer can
# run them without MongoDB, Redis or Clerk secrets and they cannot flake on them.
#
# The integration step is not: it starts a real mongod via `mongodb-memory-server`.
# That package downloads a MongoDB binary on first use, so the binary is cached
# below — without it, every push re-downloads it and a slow or blocked network
# fails the build for reasons that have nothing to do with the code.
# ==========================================
name: CI

on:
  push:
    branches: [production]
  pull_request:
  # Lets CI be re-run from the Actions tab without pushing a commit — useful for
  # confirming a flake, or for testing a cache change without touching history.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server — typecheck + lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      # Set at JOB level, not on the test step. `mongodb-memory-server` ships a
      # postinstall hook that pre-downloads the mongod binary, so the download
      # happens during `npm ci`. Scoped to the test step alone, the postinstall
      # never saw this variable and put the binary in
      # `node_modules/.cache/mongodb-memory-server` instead — a directory `npm ci`
      # deletes on every run. The resolver then *found* that copy at test time and
      # never wrote here, so this directory stayed empty, the cache saved nothing,
      # and every push re-downloaded ~100 MB while CI stayed green.
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
    steps:
      - uses: actions/checkout@v4

      # Restored before `npm ci` on purpose: on a hit the postinstall finds the
      # binary already present and skips the download, which is the whole point.
      - name: Restore the MongoDB binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.mongodb-binaries
          key: mongodb-binary-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Runs a real mongod in-process. This is where the ledger is actually
      # verified: that a `$inc` lands, that a schema hook fires, that a receipt is
      # applied once. It found two double-apply bugs that the unit tests — which
      # only assert on pure functions — passed cleanly.
      #
      # The binary these tests need is downloaded by the postinstall during
      # `npm ci` and restored from cache above; see the job-level env for why the
      # location is pinned rather than left to the library's default.
      - name: Integration tests (mongodb-memory-server)
        run: npm run test:integration

      # Guards the cache above. A cache step pointed at an empty directory
      # "succeeds" and saves nothing — which is exactly how this went unnoticed:
      # CI stayed green while every push re-downloaded ~100 MB. If the pinned
      # directory is ever empty again, fail loudly and show where mongod went.
      - name: Assert the binary landed where it is cached
        run: |
          if [ -z "$(ls -A "$MONGOMS_DOWNLOAD_DIR" 2>/dev/null)" ]; then
            echo "::error::$MONGOMS_DOWNLOAD_DIR is empty, so the cache saves nothing"
            echo "mongod was found in these locations instead:"
            find "$HOME" "$GITHUB_WORKSPACE" -name 'mongod*' -type f 2>/dev/null | head -20
            exit 1
          fi
          ls -la "$MONGOMS_DOWNLOAD_DIR"

  client:
    name: client — typecheck + lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      # expo-router only writes .expo/types/router.d.ts from the dev server, and
      # `.expo/` is gitignored — so without this step the typecheck below ran with
      # no route types at all, and `router.push("/admin/typo")` compiled clean in
      # CI while failing on any machine that had run `expo start` once. It did
      # exactly that twice while the backoffice was being built.
      #
      # This calls expo-router's own generator with a require.context we build
      # from the app directory, so it produces the same file the dev server writes
      # — verified byte-for-byte against it — in ~0.1s instead of starting Metro.
      # `npx expo export --platform web` was tried first: 113s, and it does not
      # write the types either.
      - name: Generate route types
        run: npm run types:routes

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      # `npx eslint .`, not `npx expo lint`: the latter only scans `app/` and
      # `components/`, so `hooks/` and `config/` — where every API client and
      # query hook lives — were never linted at all, in CI or by hand.
      - name: Lint
        run: npx eslint .

      # The role rules in `constants/permissions.ts` decide which backoffice
      # screens exist per role, and they are a hand-copied mirror of the
      # server's `authorize(...)` lists. Nothing else would notice them drifting
      # apart, so they are pinned here like the server's own unit tests.
      #
      # A KNOWN GAP, not an oversight: this typecheck runs *without* the
      # expo-router generated types, because `.expo/` is gitignored and only the
      # dev server writes them. So `router.push("/admin/typo")` compiles clean
      # here and fails on a machine that has run `expo start` once — which is
      # exactly what the purchasing routes hit. The permission tests below are
      # the part that can run DB-free and secret-free; regenerating the route
      # types in CI would need a Metro build and is left as a known limitation
      # rather than pretended to be covered.
      - name: Unit tests
        run: npm test
