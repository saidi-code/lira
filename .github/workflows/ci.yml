# .github/workflows/ci.yml
# ==========================================
# Nothing in this repo enforced anything before: `tsc` errors and failing tests
# reached `production` silently. This runs exactly the commands an agent runs
# by hand (see AGENT.md §13) on every push and PR.
#
# The *unit* job is DB-free on purpose — those tests use fakes, so a developer can
# run them without MongoDB, Redis or Clerk secrets and they cannot flake on them.
#
# The integration step is not: it starts a real mongod via `mongodb-memory-server`.
# That package downloads a MongoDB binary on first use, so the binary is cached
# below — without it, every push re-downloads it and a slow or blocked network
# fails the build for reasons that have nothing to do with the code.
# ==========================================
name: CI

on:
  push:
    branches: [production]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server — typecheck + lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Runs a real mongod in-process. This is where the ledger is actually
      # verified: that a `$inc` lands, that a schema hook fires, that a receipt is
      # applied once. It found two double-apply bugs that the unit tests — which
      # only assert on pure functions — passed cleanly.
      #
      # `mongodb-memory-server` downloads a ~100 MB mongod binary on first use. Its
      # own default location is `node_modules/.cache/mongodb-memory-server`, which
      # `npm ci` deletes on every run — caching that path could never survive, and
      # an earlier version of this workflow cached `~/.cache/mongodb-binaries`,
      # which the library never writes to. That cache silently missed every time
      # and saved nothing.
      #
      # `MONGOMS_DOWNLOAD_DIR` pins the location instead, and the resolver treats it
      # as the first place to both *look for* and *write* the binary. The variable
      # and the cache path below must stay identical: if they drift, the cache
      # misses again and the download returns, silently.
      - name: Cache the MongoDB binary
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.mongodb-binaries
          key: mongodb-binary-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - name: Integration tests (mongodb-memory-server)
        # Downloads the mongod binary on a cold cache (~100 MB). The step above
        # keeps every subsequent run off the network.
        env:
          MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries
        run: npm run test:integration

  client:
    name: client — typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit --pretty false

      # `npx eslint .`, not `npx expo lint`: the latter only scans `app/` and
      # `components/`, so `hooks/` and `config/` — where every API client and
      # query hook lives — were never linted at all, in CI or by hand.
      - name: Lint
        run: npx eslint .
